<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1279" viewBox="0 0 1680 1279" role="img" aria-labelledby="title desc">
  <title id="title">Forward-search tree for Middle-pop</title>
  <desc id="desc">Automatically laid out tree with uniform node sizes, long vertical layer gaps, and clear shared three-way branching junctions.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #15253d; }
      .state-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #15253d; }
      .state-text { font: 16px "Courier New", monospace; fill: #1f2937; }
      .goal-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #14532d; }
      .goal-text { font: 700 16px Arial, Helvetica, sans-serif; fill: #14532d; }
      .action { font: 16px Arial, Helvetica, sans-serif; fill: #0f3d70; }
      .note { font: 17px Arial, Helvetica, sans-serif; fill: #45556c; }
      .tree { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .solution { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .normal { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .repeat { fill: none; stroke: #b45309; stroke-width: 3; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-solution" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-normal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrow-repeat" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/></marker>
  </defs>
