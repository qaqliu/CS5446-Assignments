<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tutorial 3 Solution</title>
  <style>
    body {
      margin: 0;
      color: #111827;
      font: 16px/1.6 Arial, Helvetica, sans-serif;
    }
    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 48px;
    }
    h1, h2, h3 {
      line-height: 1.2;
      color: #111827;
    }
    h1 { font-size: 1.8rem; margin: 0 0 0.3em; }
    h2 { font-size: 1.35rem; margin-top: 1.8rem; }
    h3 { font-size: 1.1rem; margin-top: 1.2rem; }
    p, li, td, th { font-size: 1rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.3rem;
      font-size: 0.96rem;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 0.55rem 0.7rem;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f3f4f6;
    }
    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
      background: #f3f4f6;
      padding: 0.1rem 0.25rem;
      border-radius: 4px;
    }
    .math-block {
      margin: 1rem 0;
      text-align: center;
    }
    @media print {
      .page {
        margin: 0;
        max-width: none;
        min-height: auto;
        border: none;
        box-shadow: none;
        padding: 0.5in 0.6in;
      }
      a { color: inherit; text-decoration: none; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div id="content">Loading Markdown...</div>
  </main>
  <script>
    marked.setOptions({
      gfm: true,
      breaks: false
    });

    async function render() {
      const response = await fetch('solution.md');
      const markdown = await response.text();
      const mathBlocks = [];
      const markdownWithPlaceholders = markdown.replace(/\$\$([\s\S]*?)\$\$/g, (_, math) => {
        const index = mathBlocks.length;
        mathBlocks.push(math.trim());
        return `\n\n<div class="math-block" data-math-block="${index}"></div>\n\n`;
      });

      document.getElementById('content').innerHTML = marked.parse(markdownWithPlaceholders);

      for (const block of document.querySelectorAll('.math-block')) {
        const index = Number(block.getAttribute('data-math-block'));
        block.textContent = `\\[${mathBlocks[index]}\\]`;
      }

      if (window.MathJax && MathJax.typesetPromise) {
        await MathJax.typesetPromise();
      }
      document.title = 'tutorial-03 solution';
    }

    render().catch((error) => {
      document.getElementById('content').textContent = 'Failed to render Markdown: ' + error;
    });
  </script>
</body>
</html>
